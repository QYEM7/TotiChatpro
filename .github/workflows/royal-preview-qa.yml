name: Royal frontend browser QA
on:
  push:
    branches: [main, develop/phase-2]
    paths:
      - "app/**"
      - "assets/**"
      - "tests/royal-browser.cjs"
      - "tests/phase2-browser.cjs"
      - "tests/phase2-android-root-browser.cjs"
      - "tests/phase2-native-gate-browser.cjs"
      - "tests/official-auth-layout-browser.cjs"
      - "tests/phase2-voice-browser.cjs"
      - "tests/phase4-browser.cjs"
      - "tests/phase4-voice-messages-browser.cjs"
      - "scripts/build-approved-web.mjs"
      - "tests/agency-flow-browser.cjs"
      - "tests/bloom-design-browser.cjs"
      - "tests/frontend-finish-browser.cjs"
      - ".github/workflows/royal-preview-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install small browser control dependency
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24
      - name: Start local static preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/totichat-web.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8765/app/ >/dev/null
      - name: Inspect all TotiChat screens and take visual captures
        run: node tests/royal-browser.cjs
      - name: Verify agency recharge and staffing UX
        run: node tests/agency-flow-browser.cjs
      - name: Verify Bloom Signature visual contract
        run: node tests/bloom-design-browser.cjs
      - name: Verify completed frontend journeys
        run: node tests/frontend-finish-browser.cjs
      - name: Verify real Auth and room integration (mock server, no data mutations)
        if: github.ref == 'refs/heads/develop/phase-2'
        run: node tests/phase2-browser.cjs
      - name: Verify real catalog options and safe selection
        if: github.ref == 'refs/heads/develop/phase-2'
        run: node tests/phase2-catalog-browser.cjs
      - name: Verify protected catalog administration contract
        if: github.ref == 'refs/heads/develop/phase-2'
        run: node tests/phase3-admin-browser.cjs
      - name: Verify CP, redemption, receipts and XLSX UI contracts
        if: github.ref == 'refs/heads/develop/phase-2'
        run: node tests/phase4-browser.cjs
      - name: Verify private audio UI with Chromium test microphone
        if: github.ref == 'refs/heads/develop/phase-2'
        run: node tests/phase4-voice-messages-browser.cjs
      - name: Verify Capacitor Android startup renders the actual Home page
        if: github.ref == 'refs/heads/develop/phase-2'
        run: |
          npm run build
          node tests/phase2-android-root-browser.cjs
          node tests/phase2-native-gate-browser.cjs
          node tests/official-auth-layout-browser.cjs
          node tests/phase2-voice-browser.cjs
      - name: Save browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totichat-royal-qa-captures
          path: royal-preview-screenshots/
          if-no-files-found: ignore
          retention-days: 14
