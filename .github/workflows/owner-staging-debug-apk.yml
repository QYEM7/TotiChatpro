name: TotiChat Owner Staging Debug APK
# Debug-only, isolated staging build requested by the Owner on 2026-10-16.
# Never publishes to Google Play, changes production, or signs as a release.
on:
  # Run explicitly for QA only. No repeated APK builds on routine UI pushes.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-staging-debug-apk
  cancel-in-progress: true
jobs:
  build:
    name: Build unsigned-for-store debug QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm branch, staging endpoint, and debug identity
        run: |
          test "$GITHUB_REF_NAME" = "develop/phase-2"
          grep -Fq 'rziaedugbdwefbefcxjt.supabase.co' app/config.js
          grep -Fq "appId: 'com.totichat.beta'" capacitor.config.ts
          ! grep -Eq 'sb_secret_|service_role|BEGIN PRIVATE KEY' app/config.js
      - name: Install reproducible frontend toolchain
        run: npm ci --no-audit --no-fund
      - name: Check live JavaScript and premium UI syntax
        run: |
          node --check app/tc-premium-20261016.js
          node --check app/toti-nav-banner-refine.js
          node --check app/phase2-live-mode.js
          node --check app/phase2-rooms.js
          node --check app/phase2-catalog-ui.js
          node --check app/phase2-wallet.js
          node --check app/phase2-voice-ui.js
          node --check app/phase2-backend-controls.js
          node --check app/phase2-private-messages.js
          node --check scripts/build-approved-web.mjs
      - name: Frontend/backend offline contract tests
        run: |
          node --test tests/phase2-foundation.test.mjs tests/phase2-auth.test.cjs tests/phase2-wallet-security.test.cjs tests/phase2-voice-security.test.cjs
          node --test tests/firebase-android-config.test.mjs
      - name: Build real web assets and Android project
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/configure-android-auth.mjs
          node scripts/configure-firebase-android.mjs
      - name: Assemble physical debug APK
        run: |
          test -d "$ANDROID_HOME"
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon assembleDebug)
      - name: Verify APK staging UI and audio modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size>1000000
          with zipfile.ZipFile(apk) as z:
              paths=set(z.namelist())
              required=['assets/public/index.html',
                 'assets/public/app/index.html',
                 'assets/public/app/tc-premium-20261016.css',
                 'assets/public/app/tc-premium-20261016.js',
                 'assets/public/app/phase2-live-mode.js',
                 'assets/public/app/phase2-rooms.js',
                 'assets/public/app/phase2-voice-ui.js',
                 'assets/public/app/phase2-livekit-sdk.bundle.js']
              missing=set(required)-paths
              assert not missing, f'Missing frontend modules: {missing}'
              content=z.read('assets/public/index.html').decode('utf8')
              assert 'tc-premium-20261016.js' in content
              assert 'tc-premium-20261016.css' in content
          print('PASS staging debug APK:',apk.stat().st_size,'bytes')
          PY
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TotiChat-Staging-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
