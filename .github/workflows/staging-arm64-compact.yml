name: TotiChat Compact ARM64 Staging APK
on:
  push:
    branches: [feature/approved-ui-flutter-v1]
    paths:
      - '.github/workflows/staging-arm64-compact.yml'
  workflow_dispatch:
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project without replacing approved lib
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name totichat --org com.totichat .
      - name: Remove default generated widget test
        working-directory: flutter_app
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies and analyze
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze lib test --no-fatal-infos
          flutter test
      - name: Build compact ARM64 internal staging APK
        working-directory: flutter_app
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_vVYku5VtyohuiGgehC3EdA_rSDGOUKB
      - name: Upload compact staging package
        uses: actions/upload-artifact@v4
        with:
          name: TotiChat-Staging-ARM64-Compact-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
