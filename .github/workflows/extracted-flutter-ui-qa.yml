name: Extracted Flutter UI QA (no APK)

on:
  push:
    branches:
      - ui/extracted-home-20261018
    paths:
      - 'flutter_app/**'
      - '.github/workflows/extracted-flutter-ui-qa.yml'
  pull_request:
    branches:
      - rebuild/flutter-v1
    paths:
      - 'flutter_app/**'
      - '.github/workflows/extracted-flutter-ui-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extracted-flutter-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Static Flutter analysis
        working-directory: flutter_app
        run: flutter analyze lib test --no-fatal-infos
      - name: Run all existing and extracted UI tests
        working-directory: flutter_app
        run: flutter test
      - name: Verify APK was not built
        run: |
          test -z "$(find flutter_app -type f -name '*.apk' -print -quit)"

  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Capture real rendered Flutter screens without login
        working-directory: flutter_app
        run: flutter test --update-goldens tool/visual_review_capture_test.dart
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: totichat-extracted-flutter-screens-${{ github.sha }}
          path: flutter_app/tool/visual_review/*.png
          if-no-files-found: error
          retention-days: 7
