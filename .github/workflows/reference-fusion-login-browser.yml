name: TotiChat Login Real Browser Visual QA
on:
  push:
    branches:
      - design/totichat-ui-20261013
    paths:
      - 'tests/reference-fusion-login-browser.spec.mjs'
      - 'tests/reference-fusion-playwright.config.mjs'
      - '.github/workflows/reference-fusion-login-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Screen 01 browser screenshots and interactions
        run: npx playwright test --config=tests/reference-fusion-playwright.config.mjs
      - name: Save Login review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totichat-login-browser-review
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
