name: Build TotiChat Phase 2 Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [develop/phase-2]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/build-approved-web.mjs'
      - 'tests/phase2-foundation.test.mjs'
      - 'tests/phase2-auth.test.cjs'
      - 'tests/phase2-wallet-security.test.cjs'
      - 'tests/phase2-native-gate-browser.cjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/phase2-android-beta.yml'
permissions:
  contents: read
jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # ubuntu-latest already includes Android SDK. Avoid setup-android's
      # legacy sdkmanager 'tools' package lookup that fails on modern images.
      - name: Check preinstalled Android SDK
        run: |
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Install pinned Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Verify original approved HTML, assets, Auth and RLS contracts
        run: |
          node --check app/phase2-live-mode.js
          node --check app/phase2-wallet.js
          node --test tests/phase2-foundation.test.mjs tests/phase2-auth.test.cjs tests/phase2-wallet-security.test.cjs
          node --test tests/home-banners.test.cjs tests/live-supabase.test.cjs
      - name: Generate Android shell from exact approved UI
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build independently-installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify the actual APK contains the full original UI at WebView root
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size>1_000_000, 'APK missing'
          with zipfile.ZipFile(apk) as bundle:
              files=set(bundle.namelist())
              assert 'assets/public/index.html' in files, 'Missing Android launch page'
              root=bundle.read('assets/public/index.html').decode('utf-8')
              app=bundle.read('assets/public/app/index.html').decode('utf-8')
              original_head='<html lang="ar" dir="rtl"><head>'
              assert root==app.replace(original_head,original_head+'<base href="./app/">'), (
                'APK root is not the complete approved TotiChat app'
              )
              assert 'window.location.replace(\'./app/\')' not in root, (
                'Android root must NEVER redirect to the folder URL'
              )
              assert 'assets/public/app/phase2-auth.js' in files, 'Auth adapter missing'
              assert 'assets/public/app/phase2-rooms.js' in files, 'Room adapter missing'
              assert any(n.startswith('assets/public/assets/images/toti_falcon_logo_') for n in files), (
                'Branding assets missing'
              )
              print('PASS: APK launches full approved TotiChat UI directly; all assets bundled')
          PY
      - name: Assert real APK built and display checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: totichat-phase2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
