name: Compact TotiChat Staging Beta APKs

on:
  push:
    branches:
      - 'rebuild/flutter-v1'
    paths:
      - '.github/workflows/totichat-staging-compact-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-beta-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compact-staging-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify branch and staging-only source
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'rebuild/flutter-v1'
          grep -Fq 'https://rziaedugbdwefbefcxjt.supabase.co' lib/src/core/staging_config.dart
          grep -Fq 'configuredUrl == url' lib/src/core/staging_config.dart
          grep -Fq 'sb_publishable_' lib/src/core/staging_config.dart
          if grep -REn 'sb_secret_|service_role' lib/; then exit 1; fi

      - name: Verify this beta build includes latest Staging voice and gift integration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "seatGiftTotals" flutter_app/lib/src/screens/room_screen.dart
          grep -Fq "phase2-voice-moderate" flutter_app/lib/src/data/room_moderation_repository.dart
          grep -Fq "event_kind" flutter_app/lib/src/data/room_repository.dart
          test -f supabase/migrations/20261019222311_staging_verified_room_gift_chat_v1.sql
          test -f supabase/migrations/20261019222338_staging_verified_room_seat_gift_totals_v1.sql
          test -f supabase/migrations/20261019222504_staging_verified_sfu_moderation_relay_acl_v1.sql
          test -f supabase/migrations/20261019222702_staging_public_room_moderation_invoker_v2.sql
          echo 'Build commit contains beta gift and voice integration source.'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify source and unit tests
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test

      - name: Prepare isolated Android beta package
        working-directory: flutter_app
        run: |
          bash scripts/prepare_android.sh
          grep -Fq 'applicationId = "com.totichat.beta"' android/app/build.gradle.kts
          grep -Fq 'android:label="TotiChat Beta"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'com.totichat.beta' android/app/src/main/AndroidManifest.xml
          # This release-compiled *test* APK must be signed with a disposable
          # DEBUG keystore only; it may never be mistaken for production.
          grep -Fq 'signingConfig = signingConfigs.getByName("debug")' android/app/build.gradle.kts

      - name: Build split Android ARM test APKs (AOT, debug-signed)
        working-directory: flutter_app
        run: |
          flutter build apk --release --split-per-abi --no-pub --dart-define=SUPABASE_URL=https://rziaedugbdwefbefcxjt.supabase.co

      - name: Verify and prepare smaller direct-install ARM APKs
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/arm64 dist/arm32
          for pair in 'arm64-v8a:arm64' 'armeabi-v7a:arm32'; do
            abi="${pair%%:*}"
            folder="${pair##*:}"
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$src"
            unzip -t "$src" > /dev/null
            cp "$src" "dist/$folder/TotiChat-Staging-Beta-$folder.apk"
            (
              cd "dist/$folder"
              sha256sum "TotiChat-Staging-Beta-$folder.apk" > SHA256SUMS.txt
              cat SHA256SUMS.txt
            )
          done
          du -h dist/arm64/*.apk dist/arm32/*.apk

      - name: Upload ARM64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: TotiChat-Staging-Beta-ARM64-APK
          path: flutter_app/dist/arm64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ARM32 test APK
        uses: actions/upload-artifact@v4
        with:
          name: TotiChat-Staging-Beta-ARM32-APK
          path: flutter_app/dist/arm32/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Explicitly no store or server deployment
        run: echo 'Test-only APK artifacts; Staging only, no Google Play, no production deployment.'
