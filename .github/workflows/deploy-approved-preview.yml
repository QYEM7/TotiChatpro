name: Verify approved TotiChat visual master
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/images/**'
      - 'reference/approved-assets.gitsha'
      - 'reference/approved-original.html'
      - '.github/workflows/deploy-approved-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-approved-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact approved visual master and 27 image assets
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while read -r expected filename; do
            [[ -z "${expected:-}" || "${expected:0:1}" == "#" ]] && continue
            test -s "assets/images/$filename"
            actual="$(git hash-object "assets/images/$filename")"
            [[ "$actual" == "$expected" ]] || { echo "::error::Image mismatch: $filename"; exit 1; }
            found=$((found+1))
          done < reference/approved-assets.gitsha
          [[ "$found" -eq 27 ]] || { echo "::error::Expected 27 images, found $found"; exit 1; }
          test -s index.html
          test -s reference/approved-original.html
          if grep -Fq 'raw.githubusercontent.com/jsjsnsnsnsn0-pixel/TotiChat/main/public/assets/images/' index.html; then
            echo "::error::Preview still refers to the old repository"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          original=Path("reference/approved-original.html").read_text()
          independent=Path("index.html").read_text()
          old="https://raw.githubusercontent.com/jsjsnsnsnsn0-pixel/TotiChat/main/public/assets/images/"
          assert original.replace(old,"assets/images/")==independent, "Approved UI HTML changed beyond local asset URLs"
          print("PASS: UI master matches approved original; only 9 image URL references localized.")
          PY
          echo "PASS: All 27 approved images exactly match their source Git hashes."
