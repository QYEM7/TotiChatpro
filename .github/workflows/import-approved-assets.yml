name: Import exact approved visual assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-original-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out clean TotiChatpro repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy and verify 27 pinned design images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          BASE="https://raw.githubusercontent.com/jsjsnsnsnsn0-pixel/TotiChat/3df904f289a39731af043a74d28aa4a743a98804/public/assets/images"
          downloaded=0
          while read -r expected filename; do
            [[ -z "${expected:-}" || "${expected:0:1}" == "#" ]] && continue
            if [[ ! "$filename" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::Unsafe file name in manifest"
              exit 1
            fi
            curl --fail --show-error --silent --location --retry 4 --retry-delay 2 --max-time 90 \
              "$BASE/$filename" --output "assets/images/$filename"
            actual="$(git hash-object "assets/images/$filename")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Asset hash mismatch: $filename; expected $expected got $actual"
              exit 1
            fi
            downloaded=$((downloaded+1))
          done < reference/approved-assets.gitsha
          [[ "$downloaded" -eq 27 ]] || { echo "::error::Expected 27 images, got $downloaded"; exit 1; }
          if grep -q 'raw.githubusercontent.com/jsjsnsnsnsn0-pixel/TotiChat/main/public/assets/images/' index.html; then
            echo "::error::Preview still depends on old repository images"
            exit 1
          fi
          test -s index.html
          echo "All 27 original images verified; self-contained preview HTML present."
      - name: Commit verified images into clean repository
        shell: bash
        run: |
          set -euo pipefail
          git add assets/images
          if git diff --cached --quiet; then
            echo "All approved images are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: import and SHA-verify all 27 approved UI image assets"
          git push origin HEAD:main
