name: Android 14 real-boot smoke test

on:
  push:
    branches:
      - 'rebuild/flutter-v1'
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-boot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android14-first-frame:
    name: Boot Android 14 emulator and capture Flutter startup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure Staging-only Android package
        working-directory: flutter_app
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'rebuild/flutter-v1'
          grep -Fq 'configuredUrl == url' lib/src/core/staging_config.dart
          grep -Fq 'runApp(StartupGate(' lib/main.dart
          if grep -REn 'sb_secret_|service_role' lib/; then exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter-required Android NDK with clean retries
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk_dir="$ANDROID_HOME/ndk/28.2.13676358"
          for attempt in 1 2 3; do
            if test -s "$ndk_dir/source.properties"; then
              echo "Android NDK 28.2.13676358 ready"
              exit 0
            fi
            echo "Installing NDK 28.2.13676358, attempt $attempt"
            rm -rf "$ndk_dir"
            if "$sdkmanager" --install "ndk;28.2.13676358" </dev/null; then
              test -s "$ndk_dir/source.properties" && exit 0
            fi
            sleep 5
          done
          echo "NDK download failed repeatedly; app runtime not reached"
          exit 1

      - name: Compile debug Android app for x86-64 Android 14 emulator
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test
          bash scripts/prepare_android.sh
          flutter build apk --debug --no-pub --dart-define=SUPABASE_URL=https://rziaedugbdwefbefcxjt.supabase.co
          test -s build/app/outputs/flutter-apk/app-debug.apk
          test -s android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fq 'lib/x86_64/libdartjni.so'
          mkdir -p ../android-smoke
          cp build/app/outputs/flutter-apk/app-debug.apk ../android-smoke/boot-smoke-debug.apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 14 and open the actual app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            # android-emulator-runner executes this body with /bin/sh, not bash.
            set -eu
            mkdir -p android-smoke
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard || true
            adb logcat -c
            adb install -r android-smoke/boot-smoke-debug.apk
            adb shell am force-stop com.totichat.beta || true
            adb shell am start -W -n com.totichat.beta/com.totichat.totichat.MainActivity > android-smoke/activity-launch.txt
            cat android-smoke/activity-launch.txt
            sleep 24
            adb shell pidof com.totichat.beta | tee android-smoke/pid.txt || true
            adb shell dumpsys activity activities > android-smoke/activity-dumpsys.txt
            adb logcat -d -v time > android-smoke/logcat.txt
            adb shell screencap -p /sdcard/totichat-first-frame.png
            adb pull /sdcard/totichat-first-frame.png android-smoke/screenshot.png
            adb shell uiautomator dump /sdcard/totichat-ui.xml || true
            adb pull /sdcard/totichat-ui.xml android-smoke/ui.xml || true
            # android-emulator-runner invokes each line under /bin/sh -c, so
            # all assertions must be one-line shell commands.
            grep -qE '^[0-9]+

      - name: Publish startup evidence even when emulator fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totichat-android14-startup-evidence
          path: |
            android-smoke/screenshot.png
            android-smoke/logcat.txt
            android-smoke/ui.xml
            android-smoke/pid.txt
            android-smoke/activity-launch.txt
            android-smoke/activity-dumpsys.txt
          if-no-files-found: warn
          retention-days: 7
 android-smoke/pid.txt
            ! grep -qE 'FATAL EXCEPTION: main|Unable to instantiate activity|Could not resolve activity' android-smoke/logcat.txt
            ! grep -q 'Failed to load dynamic library at path: libdartjni.so' android-smoke/logcat.txt
            ! grep -q 'GeneratedPluginRegistrant' android-smoke/logcat.txt
            ! grep -q 'could not start' android-smoke/ui.xml
            grep -q 'Toti Chat' android-smoke/ui.xml
            echo 'PASS: Android 14 reached actual TotiChat Google login screen.'

      - name: Publish startup evidence even when emulator fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totichat-android14-startup-evidence
          path: |
            android-smoke/screenshot.png
            android-smoke/logcat.txt
            android-smoke/ui.xml
            android-smoke/pid.txt
            android-smoke/activity-launch.txt
            android-smoke/activity-dumpsys.txt
          if-no-files-found: warn
          retention-days: 7
