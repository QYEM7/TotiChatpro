name: TotiChat Login Staging Public Auth Probe

on:
  workflow_dispatch:
  push:
    branches:
      - design/totichat-ui-20261013
    paths:
      - 'tests/reference-fusion-staging-auth-probe.mjs'
      - '.github/workflows/reference-fusion-staging-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Public HTTPS and Google provider checks (no credentials)
        run: node tests/reference-fusion-staging-auth-probe.mjs
