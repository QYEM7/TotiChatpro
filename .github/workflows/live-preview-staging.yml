name: TotiChat REAL isolated web preview (no APK)
on:
  push:
    branches: [develop/phase-2]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/build-live-preview.mjs'
      - 'scripts/t03-staging-config.mjs'
      - 'tests/live-preview-build.test.mjs'
      - 'tests/registered-staging-preview.test.mjs'
      - 'tests/live-staging-critical-path.test.mjs'
      - 'tests/staging-release-regression.test.mjs'
      - 'tests/phase2-foundation.test.mjs'
      - 'supabase/migrations/20261011000100_phase2_room_identity_background.sql'
      - 'supabase/migrations/20261011000101_phase2_room_image_revision.sql'
      - 'supabase/migrations/**'
      - 'docs/STAGING_BACKEND_HANDOFF_2026-10-11.md'
      - 'scripts/build-registered-staging-preview.mjs'
      - 'docs/preview-public-backend.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/live-preview-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify no production backend and no fake preview entry
        run: node --test tests/live-preview-build.test.mjs tests/t03-staging-safety.test.mjs tests/registered-staging-preview.test.mjs tests/live-staging-critical-path.test.mjs tests/staging-release-regression.test.mjs
      - name: Syntax-check live room, auth, voice and event modules
        run: |
          node --check app/phase2-rooms.js
          node --check app/phase2-auth.js
          node --check app/phase2-voice-ui.js
          node --check app/phase2-live-mode.js
          node --check app/phase2-private-messages.js
          node --check app/phase2-global-gifts.js
          node --check app/phase2-backend-controls.js
          node --check app/phase5-support-ui.js
          node --check app/phase2-catalog-ui.js
      - name: Assemble approved browser UI only (NEVER Gradle or APK)
        run: npm run build
      - name: Verify offline Android wrapper retains approved assets and uses staging backend
        run: npm run test:foundation
      - name: Smoke-build full approved website with SYNTHETIC isolated public config (never deploy)
        env:
          STAGING_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OFFLINE_FIXTURE_ONLY
        run: |
          node scripts/build-live-preview.mjs
          node --check dist-live-preview/app/config.js
          node --check dist-live-preview/app/phase2-live-mode.js
          node -e "const s=require('./dist-live-preview/preview-status.json');if(!s.backend_isolated||s.release_allowed||s.apk_built!==false)process.exit(1)"
      - name: Build TotiChat browser app against the real staging PUBLIC endpoint (never deploy here)
        run: |
          node scripts/build-registered-staging-preview.mjs
          node --check dist-live-preview/app/config.js
          node --check dist-live-preview/app/phase2-live-mode.js
      - name: Keep the approved WEB staging app as a short-lived QA artifact (not an APK)
        uses: actions/upload-artifact@v4
        with:
          name: totichat-approved-live-staging-web
          path: dist-live-preview/
          retention-days: 7
          if-no-files-found: error
  publish-preview:
    needs: source-check
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment: live-preview
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse Cloudflare deploy when account/token have not been connected
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "BLOCKED: Cloudflare credentials not connected"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "BLOCKED: Cloudflare account not connected"; exit 2; }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Compile browser preview using registered PUBLIC staging config only
        run: node scripts/build-registered-staging-preview.mjs
      - name: Deploy Cloudflare Pages preview branch without affecting public landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 pages deploy dist-live-preview --project-name totichatpro --branch preview
