name: TotiChat staging Android debug APK

# Test APK builds require an intentional manual workflow dispatch.
# Ordinary development pushes run flutter-beta-checks.yml instead.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totichat-staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging-debug:
    if: github.ref == 'refs/heads/rebuild/flutter-v1'
    name: Build Android debug APK (Staging ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout authorized development branch
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Static analysis
        working-directory: flutter_app
        run: flutter analyze lib test

      - name: Source tests
        working-directory: flutter_app
        run: flutter test

      - name: Generate Android host with Staging OAuth callback
        working-directory: flutter_app
        run: bash scripts/prepare_android.sh

      - name: Assert Staging-only Android identity and backend
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path('lib/src/core/staging_config.dart').read_text()
          gradle = Path('android/app/build.gradle.kts').read_text()
          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text()
          expected = 'https://rziaedugbdwefbefcxjt.supabase.co'

          assert re.search(r"static const url\s*=\s*'"+re.escape(expected)+r"'", config), 'Missing Staging URL'
          assert 'configuredUrl == url' in config, 'Fail-closed URL check absent'
          assert 'com.totichat.beta://auth/callback' in config, 'OAuth return mismatch'
          assert 'applicationId = "com.totichat.beta"' in gradle, 'Wrong Android application ID'
          assert 'android:label="TotiChat Beta"' in manifest, 'Wrong Android app label'
          assert 'android:scheme="com.totichat.beta"' in manifest, 'OAuth scheme missing'
          assert 'android:host="auth"' in manifest and 'android:pathPrefix="/callback"' in manifest
          assert 'android.permission.INTERNET' in manifest and 'android.permission.RECORD_AUDIO' in manifest
          print('Staging URL, package ID, OAuth return and permissions verified')
          PY

      - name: Build installable DEBUG APK (not a release package)
        working-directory: flutter_app
        run: |
          flutter build apk --debug --no-pub \
            --dart-define=SUPABASE_URL=https://rziaedugbdwefbefcxjt.supabase.co

      - name: Verify APK integrity and calculate SHA256
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          path = Path('build/app/outputs/flutter-apk/app-debug.apk')
          assert path.is_file() and path.stat().st_size > 1_000_000, 'Missing or undersized APK'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              assert bad is None, f'Corrupt APK entry: {bad}'
          print(f'APK: {path} ({path.stat().st_size} bytes)')
          print('SHA256:', hashlib.sha256(path.read_bytes()).hexdigest())
          print('DEBUG BUILD ONLY — NOT production-signed, device-tested or approved for release')
          PY

      - name: Inspect actual Android package and label
        working-directory: flutter_app
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$aapt"
          badging="$("$aapt" dump badging build/app/outputs/flutter-apk/app-debug.apk)"
          printf '%s\n' "$badging" | grep -Fq "package: name='com.totichat.beta'"
          printf '%s\n' "$badging" | grep -Fq "application-label:'TotiChat Beta'"
          (cd build/app/outputs/flutter-apk && sha256sum app-debug.apk > SHA256SUMS.txt)
          echo 'Validated compiled package ID, beta label and APK checksum file.'

      - name: Upload ephemeral Android test artifact
        uses: actions/upload-artifact@v4
        with:
          name: totichat-staging-debug-${{ github.sha }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-debug.apk
            flutter_app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
