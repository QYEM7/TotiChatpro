name: T03 isolated local full-stack integration
on:
  pull_request:
    branches: [develop/phase-2]
    paths:
      - 'scripts/t03-local-auth-smoke.mjs'
      - 'scripts/t06-parallel-support-e2e.mjs'
      - 'scripts/t06-parallel-finance-e2e.mjs'
      - 'tests/t06-parallel-finance-contract.test.cjs'
      - 'tests/t06-parallel-support-contract.test.cjs'
      - 'scripts/t16-rooms-e2e.mjs'
      - 'scripts/t14-avatar-e2e.mjs'
      - 'scripts/t17-realtime-e2e.mjs'
      - 'scripts/t16-rooms-e2e.mjs'
      - 'scripts/t03-secret-audit.mjs'
      - 'scripts/t49-disposable-restore-drill.sh'
      - 'scripts/t49-storage-object-restore.mjs'
      - 'tests/t49-storage-restore-contract.test.cjs'
      - 'tests/t49-disposable-restore-contract.test.cjs'
      - 'tests/t03-secret-audit.test.mjs'
      - '.github/workflows/t03-full-stack.yml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  push:
    branches: [develop/phase-2]
    paths:
      - 'scripts/t03-local-auth-smoke.mjs'
      - 'scripts/t06-parallel-support-e2e.mjs'
      - 'scripts/t06-parallel-finance-e2e.mjs'
      - 'tests/t06-parallel-finance-contract.test.cjs'
      - 'tests/t06-parallel-support-contract.test.cjs'
      - 'scripts/t03-secret-audit.mjs'
      - 'scripts/t49-disposable-restore-drill.sh'
      - 'scripts/t49-storage-object-restore.mjs'
      - 'tests/t49-storage-restore-contract.test.cjs'
      - 'tests/t49-disposable-restore-contract.test.cjs'
      - 'tests/t03-secret-audit.test.mjs'
      - '.github/workflows/t03-full-stack.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-services:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tracked files have no private credentials
        run: |
          node scripts/t03-secret-audit.mjs
          node --test tests/t03-secret-audit.test.mjs
          node --check scripts/t06-parallel-support-e2e.mjs
          node --check scripts/t06-parallel-finance-e2e.mjs
          node --test tests/t06-parallel-support-contract.test.cjs tests/t06-parallel-finance-contract.test.cjs
      - name: Validate 32 migration fingerprint baseline
        run: node --test tests/t01-migration-history.test.cjs
      - name: T49 refuse production recovery pretence or linked DB access
        run: |
          bash -n scripts/t49-disposable-restore-drill.sh
          node --test tests/t49-disposable-restore-contract.test.cjs tests/t49-storage-restore-contract.test.cjs
      - name: Setup pinned Supabase CLI (unlinked, local only)
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Launch disposable local Auth, REST, Storage and PostgreSQL services
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t03-full-stack"
          cd "$RUNNER_TEMP/t03-full-stack"
          supabase init > "$RUNNER_TEMP/t03-init.log" 2>&1
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          # No supabase link; no production data, no external secrets, no db push.
          if ! supabase start > "$RUNNER_TEMP/t03-start.log" 2>&1; then
            echo "::error::Disposable local Supabase services could not start; raw token-bearing CLI output withheld"
            exit 1
          fi
          supabase status --output json > "$RUNNER_TEMP/t03-local-status.json"
          cd "$GITHUB_WORKSPACE"
          node scripts/t03-local-auth-smoke.mjs "$RUNNER_TEMP/t03-local-status.json"
          node scripts/t16-rooms-e2e.mjs "$RUNNER_TEMP/t03-local-status.json"
          node scripts/t14-avatar-e2e.mjs "$RUNNER_TEMP/t03-local-status.json"
          node scripts/t17-realtime-e2e.mjs "$RUNNER_TEMP/t03-local-status.json"
          node scripts/t23-music-e2e.mjs "$RUNNER_TEMP/t03-local-status.json"
          # Authenticated parallel API requests against local PostgREST only.
          T06_DISPOSABLE_ONLY=YES \
            SUPABASE_ACCESS_TOKEN='' SUPABASE_DB_PASSWORD='' \
            node scripts/t06-parallel-support-e2e.mjs "$RUNNER_TEMP/t03-local-status.json"
          # Synthetic Owner account exists ONLY in isolated local PostgreSQL.
          T06_DISPOSABLE_ONLY=YES \
            SUPABASE_ACCESS_TOKEN='' SUPABASE_DB_PASSWORD='' \
            node scripts/t06-parallel-finance-e2e.mjs "$RUNNER_TEMP/t03-local-status.json"
          T49_DISPOSABLE_ONLY=YES \
            SUPABASE_ACCESS_TOKEN='' SUPABASE_DB_PASSWORD='' \
            node scripts/t49-storage-object-restore.mjs "$RUNNER_TEMP/t03-local-status.json"
          # Strictly on a disposable unlinked Docker instance.
          mapfile -t db_containers < <(docker ps --format '{{.Names}}' | grep '^supabase_db_' || true)
          test "${#db_containers[@]}" -eq 1 || { echo "::error::Ambiguous local Postgres container"; exit 1; }
          for test_sql in t04_security_invariants.sql t04_fk_index_coverage.sql phase3_admin.sql phase4_sessions.sql t06_financial_limits.sql t06_recharge_serial_actor.sql t06_support_concurrency_privacy.sql t14_avatar_storage.sql t17_room_realtime.sql t23_music_rls.sql t36_host_month_preflight.sql t42_support_tickets.sql t42_support_roster_paging.sql phase3_rooms.sql phase3_gifts.sql phase3_store.sql phase3_transfer.sql phase4_agencies.sql phase4_cp.sql phase4_redemption.sql phase4_reports.sql phase4_voice_messages.sql; do
            echo "T04/T05 local security test: $test_sql"
            docker exec -i "${db_containers[0]}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$GITHUB_WORKSPACE/supabase/tests/$test_sql" | grep -E "^PASS|^DO$|^ROLLBACK$"
          done
          # Separate local DB restored from test-only custom pg_dump. No production access.
          T49_DISPOSABLE_ONLY=YES \
            SUPABASE_ACCESS_TOKEN='' SUPABASE_DB_PASSWORD='' \
            bash "$GITHUB_WORKSPACE/scripts/t49-disposable-restore-drill.sh"
