name: Phase 2 isolated foundation QA
on:
  push:
    branches: [develop/phase-2]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase2-foundation.yml'
  pull_request:
    branches: [develop/phase-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Android voice bundling dependencies
        run: npm ci --no-audit --no-fund
      - name: Check isolated builder syntax
        run: |
          node --check scripts/build-approved-web.mjs
          node --check app/phase2-rooms.js
          node --check app/phase2-auth.js
          node --check app/phase2-security-ui.js
          node --check app/phase3-transfer-ui.js
          node --check app/phase3-admin-ui.js
          node --check app/phase4-cp-ui.js
          node --check app/phase4-redemption-ui.js
          node --check app/phase4-reports-ui.js
          node --check app/phase4-gift-receipts.js
          node --check app/phase4-agencies-ui.js
          node --check e2e/critical-flow.spec.mjs
          node --check app/phase2-ui.js
          node --check app/phase2-live-mode.js
          node --check app/phase2-wallet.js
          node --check app/phase2-catalog-data.js
          node --check app/phase2-catalog-ui.js
          node --check app/phase2-voice-ui.js
          node --check app/phase2-livekit-sdk.mjs
          node --check tests/phase2-browser.cjs
      - name: Verify exact UI/asset Android payload and independent backend
        run: node --test tests/phase2-foundation.test.mjs tests/phase2-*.test.cjs
      - name: Run approved-banner + UI integrity regression contracts
        run: node --test tests/home-banners.test.cjs tests/live-supabase.test.cjs
