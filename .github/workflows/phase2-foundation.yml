name: Phase 2 isolated foundation QA
on:
  push:
    branches: [develop/phase-2]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase2-foundation.yml'
  pull_request:
    branches: [develop/phase-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Android voice bundling dependencies
        run: npm ci --no-audit --no-fund
      - name: Check isolated builder syntax
        run: |
          node --check scripts/build-approved-web.mjs
          node --check app/phase2-rooms.js
          node --check app/phase2-auth.js
          node --check app/phase2-security-ui.js
          node --check app/phase5-support-ui.js
          node --check tests/t42-support-browser.cjs
          node --check app/phase3-transfer-ui.js
          node --check app/phase3-admin-ui.js
          node --check app/phase4-cp-ui.js
          node --check app/phase4-redemption-ui.js
          node --check app/phase4-reports-ui.js
          node --check app/phase4-gift-receipts.js
          node --check app/phase4-agencies-ui.js
          node --check app/phase4-voice-messages-ui.js
          node --check e2e/critical-flow.spec.mjs
          node --check app/phase2-ui.js
          node --check app/phase2-live-mode.js
          node --check app/phase2-wallet.js
          node --check app/phase2-catalog-data.js
          node --check app/phase2-catalog-ui.js
          node --check app/phase2-voice-ui.js
          node --check app/phase2-livekit-sdk.mjs
          node --check tests/phase2-browser.cjs
      - name: Verify Owner's manual-operations-only beta scope and no release-gate bypass
        run: node --test tests/beta30-scope-freeze.test.cjs
      - name: T48 block all APK builds before independently verified 80% readiness
        run: node --test tests/t48-no-apk-before-80.test.cjs tests/t48-release-threshold-matrix.test.cjs
      - name: T06 verify durable voice Edge rate budget and fail-closed responses
        run: node --test tests/t06-voice-edge-limit.test.mjs
      - name: T06 harden support concurrency and keep private messages out of retry ledger
        run: node --test tests/t06-support-hardening.test.cjs
      - name: T42 verify ticket privacy, real API UI wiring and role boundaries
        run: node --test tests/t42-support-contract.test.cjs
      - name: T23 verify actual music bookmark and queue UI safety
        run: node --test tests/t23-music-ui.test.cjs
      - name: T17 verify foreground and reconnect room-state recovery
        run: node --test tests/t17-room-foreground.test.cjs
      - name: T09/T11 verify real login and honest live room actions
        run: node --test tests/t09-t11-integrity.test.cjs
      - name: T10 verify live Android never silently becomes sample-preview
        run: node --test tests/t10-no-demo-bypass.test.cjs
      - name: T50 create truthful release-blocker evidence without declaring readiness
        run: node scripts/t50-release-readiness.mjs
      - name: T03 scan committed code for private tokens and credential files
        run: |
          node scripts/t03-secret-audit.mjs
          node --test tests/t03-secret-audit.test.mjs
      - name: T03 isolated staging and public-config safety tests
        run: node --test tests/t03-staging-safety.test.mjs
      - name: T02 check commit and changed-path audit snapshots (no network writes)
        run: node --test tests/t02-commit-manifest.test.cjs
      - name: T01 check applied Supabase migration snapshot (no database writes)
        run: node --test tests/t01-migration-history.test.cjs
      - name: Verify exact UI/asset Android payload and independent backend
        run: node --test tests/phase2-foundation.test.mjs tests/phase2-*.test.cjs
      - name: Run approved-banner + UI integrity regression contracts
        run: node --test tests/home-banners.test.cjs tests/live-supabase.test.cjs
