name: TotiChat comprehensive staging source QA
on:
  push:
    branches: [develop/phase-2]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'docs/preview-public-backend.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/comprehensive-staging-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totichat-staging-source-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-source-qa:
    if: github.ref == 'refs/heads/develop/phase-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - name: Checkout approved development branch (never production)
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax-check application and infrastructure JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find app scripts -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 |
            xargs -0 -r -n 1 node --check
      - name: Run ALL offline repository test files sequentially
        run: node --test --test-concurrency=1 tests/*.test.cjs tests/*.test.mjs
      - name: Verify Owner development-only policy (no releases/builds)
        run: node scripts/check-development-only-mode.mjs
      - name: Audit committed secrets (no remote database)
        run: node scripts/t03-secret-audit.mjs
      - name: Build approved app and registered STAGING-only browser preview
        # Disabled by Owner: no app version, even web preview artifacts.
        if: ${{ false }}
        run: |
          npm run build
          node scripts/build-registered-staging-preview.mjs
      - name: Verify preview contains no Android APK or production backend
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-live-preview/preview-status.json
          test -f dist-live-preview/app/config.js
          if find dist-live-preview -type f \( -name '*.apk' -o -name '*.aab' \) | grep -q .; then
            echo 'BLOCKED: Unexpected Android release artifact' >&2
            exit 1
          fi
          node -e "const fs=require('node:fs');const c=fs.readFileSync('dist-live-preview/app/config.js','utf8');const s=JSON.parse(fs.readFileSync('dist-live-preview/preview-status.json','utf8'));if(!c.includes('rziaedugbdwefbefcxjt')||c.includes('sqedsnyvjblvbjbizcay')||!s.backend_isolated||s.release_allowed!==false)process.exit(1)"
      - name: Preserve inspected STAGING web artifact for QA only
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: totichat-comprehensive-staging-web
          path: dist-live-preview/
          retention-days: 7
          if-no-files-found: error
