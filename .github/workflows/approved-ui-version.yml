name: TotiChat New UI Test Builds (Staging Only)
on:
  push:
    branches: [feature/approved-ui-flutter-v1]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/approved-ui-version.yml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

env:
  STAGING_PUBLIC_KEY: sb_publishable_vVYku5VtyohuiGgehC3EdA_rSDGOUKB

jobs:
  web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=web --project-name totichat .
      - name: Remove unapproved autogenerated widget test
        working-directory: flutter_app
        run: rm -f test/widget_test.dart
      - name: Fetch Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Source analysis
        working-directory: flutter_app
        run: flutter analyze lib test --no-fatal-infos
      - name: Build browser preview using public Staging key only
        working-directory: flutter_app
        run: |
          flutter build web --release --base-href /TotiChatpro/ \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$STAGING_PUBLIC_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: TotiChat-approved-Flutter-web-preview
          path: flutter_app/build/web/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web/

  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name totichat --org com.totichat .
      - name: Remove unapproved autogenerated widget test
        working-directory: flutter_app
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Source analysis
        working-directory: flutter_app
        run: flutter analyze lib test --no-fatal-infos
      - name: Run client tests
        working-directory: flutter_app
        run: flutter test
      - name: Build debug test APK (explicitly requested test version; no Play release)
        working-directory: flutter_app
        run: flutter build apk --debug --dart-define=SUPABASE_PUBLISHABLE_KEY="$STAGING_PUBLIC_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: TotiChat-approved-Flutter-staging-Android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  deploy-browser:
    needs: web-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
