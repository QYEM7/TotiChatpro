name: TotiChat Reborn Android Staging Debug APK
# Explicitly isolated Android QA build: no production, Play submission or release signing.
on:
  push:
    branches: [develop/phase-2]
    paths:
      - '.github/workflows/reborn-android-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Staging-only preflight
        run: |
          test "$GITHUB_REF_NAME" = "develop/phase-2"
          grep -Fq 'rziaedugbdwefbefcxjt.supabase.co' app/config.js
          grep -Fq "appId: 'com.totichat.beta'" capacitor.config.ts
          ! grep -Eq 'sb_secret_|service_role|BEGIN PRIVATE KEY' app/config.js
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Reborn tests and build new frontend
        run: |
          npm run test:reborn
          node --check app/reborn/core.js
          node --check app/reborn/features.js
          npm run build
      - name: Generate Android shell and OAuth bridge
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-android-auth.mjs
          node scripts/configure-firebase-android.mjs
      - name: Assemble Android debug APK
        run: |
          test -d "$ANDROID_HOME"
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Inspect the real APK and reject legacy UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.exists() and apk.stat().st_size>1_000_000
          with zipfile.ZipFile(apk) as pkg:
              names=set(pkg.namelist())
              for name in ['assets/public/index.html',
                           'assets/public/app/reborn/core.js',
                           'assets/public/app/reborn/features.js',
                           'assets/public/app/reborn/styles.css',
                           'assets/public/app/reborn/native-bridge.bundle.js',
                           'assets/public/app/phase2-auth.js',
                           'assets/public/app/phase2-livekit-sdk.bundle.js']:
                  assert name in names, f'APK missing {name}'
              main=pkg.read('assets/public/index.html').decode('utf-8')
              assert 'reborn/core.js' in main
              assert 'royal-final.js' not in main
              assert 'frontend-finish.js' not in main
          print('PASS: new TotiChat Reborn Android staging APK bytes:',apk.stat().st_size)
          PY
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TotiChat-Reborn-Staging-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
