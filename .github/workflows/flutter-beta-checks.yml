name: Flutter beta source checks

on:
  push:
    branches:
      - 'rebuild/flutter-v1'
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-beta-checks.yml'
  pull_request:
    branches:
      - 'rebuild/flutter-v1'
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-beta-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-beta-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-source-checks:
    name: Analyze and test Flutter (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out only the active branch
        uses: actions/checkout@v4
      - name: Install stable Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show compiler version
        run: |
          flutter --version
          dart --version
      - name: Resolve Dart dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Flutter source and tests
        working-directory: flutter_app
        run: flutter analyze lib test
      - name: Run Dart and Flutter tests
        working-directory: flutter_app
        run: flutter test
      - name: Render approved UI composition as a real Flutter golden image
        working-directory: flutter_app
        env:
          TOTICHAT_CAPTURE_GOLDEN: '1'
        run: flutter test --update-goldens test/reference_visual_test.dart

      - name: Upload actual Flutter reference composition for visual review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: totichat-reference-home-flutter-screenshot
          path: flutter_app/test/goldens/reference-home-empty.png
          retention-days: 7
          if-no-files-found: error

      - name: Generate Android host files and validate OAuth deep link (no build)
        working-directory: flutter_app
        run: bash scripts/prepare_android.sh
      - name: Store Android host source for review
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-host-source
          path: flutter_app/android/
          retention-days: 3
          if-no-files-found: error
      - name: Confirm no release outputs were produced
        working-directory: flutter_app
        run: |
          if find . -type f \( -name '*.apk' -o -name '*.aab' \) | grep -q .; then
            echo 'ERROR: No APK/AAB may be generated in this workflow.'
            exit 1
          fi
          echo 'Source checks only. No APK, database migrations or deployment.'
