name: TotiChat Login Screen Review QA

on:
  push:
    branches:
      - design/totichat-ui-20261013
    paths:
      - 'design/reference-fusion-20261013/login/**'
      - 'tests/reference-fusion-login.test.mjs'
      - '.github/workflows/reference-fusion-login-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node runtime
        run: node --version
      - name: Google-only Login DOM/auth contract tests
        run: node --test tests/reference-fusion-login.test.mjs
