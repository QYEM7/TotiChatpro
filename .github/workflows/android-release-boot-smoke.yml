name: Android 14 release-mode startup diagnosis

# PluginFix2 ran on a physical ARM phone as a release/AOT binary, but the
# previous emulator smoke test used a debug/JIT binary. Test the release path
# independently before claiming the white-screen incident is resolved.
on:
  push:
    branches:
      - 'rebuild/flutter-v1'
    paths:
      - '.github/workflows/android-release-boot-smoke.yml'
      - 'flutter_app/**'
  pull_request:
    branches:
      - 'rebuild/flutter-v1'
    paths:
      - 'flutter_app/**'
      - '.github/workflows/android-release-boot-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android14-release-first-frame:
    name: Android 14 release/AOT login screen (x86_64 emulator)
    if: github.ref == 'refs/heads/rebuild/flutter-v1' || github.base_ref == 'rebuild/flutter-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce isolated Staging configuration
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'rebuild/flutter-v1' || test "${GITHUB_BASE_REF:-}" = 'rebuild/flutter-v1'
          grep -Fq 'https://rziaedugbdwefbefcxjt.supabase.co' lib/src/core/staging_config.dart
          grep -Fq 'configuredUrl == url' lib/src/core/staging_config.dart
          grep -Fq 'runApp(StartupGate(' lib/main.dart
          if grep -REn 'sb_secret_|service_role' lib/; then exit 1; fi
          echo 'Staging-only assertions passed.'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK with retries
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk_dir="$ANDROID_HOME/ndk/28.2.13676358"
          for attempt in 1 2 3; do
            if test -s "$ndk_dir/source.properties"; then exit 0; fi
            rm -rf "$ndk_dir"
            if "$sdkmanager" --install "ndk;28.2.13676358" </dev/null; then
              test -s "$ndk_dir/source.properties" && exit 0
            fi
            sleep 5
          done
          echo 'Android NDK installation failed; runtime was not tested'
          exit 1

      - name: Build actual release/AOT binary for Android 14 emulator
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          # The 2.5.0 JNI implementation breaks Android release under R8.
          # Check the actual resolved version, not only pubspec declarations.
          flutter pub deps --style=compact | grep -F 'shared_preferences_android 2.4.28'
          flutter analyze lib test
          flutter test
          bash scripts/prepare_android.sh
          # Supabase uses app_links; Flutter's default handler must be off.
          grep -Fq 'android:name="flutter_deeplinking_enabled" android:value="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:scheme="com.totichat.beta"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:host="auth"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:pathPrefix="/callback"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'applicationId = "com.totichat.beta"' android/app/build.gradle.kts
          grep -Fq 'signingConfig = signingConfigs.getByName("debug")' android/app/build.gradle.kts
          grep -Fq 'io.flutter.embedding.android.EnableImpeller' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --split-per-abi --no-pub \
            --dart-define=SUPABASE_URL=https://rziaedugbdwefbefcxjt.supabase.co
          apk=build/app/outputs/flutter-apk/app-x86_64-release.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" | grep -Fq 'lib/x86_64/libdartjni.so'
          unzip -Z1 "$apk" | grep -Fq 'lib/x86_64/libapp.so'
          unzip -Z1 "$apk" | grep -Fq 'lib/x86_64/libflutter.so'
          mkdir -p ../android-release-smoke
          cp "$apk" ../android-release-smoke/boot-smoke-release.apk
          sha256sum "$apk" > ../android-release-smoke/release-apk-sha256.txt
          echo 'Compiled release/AOT APK, not a debug-mode substitute.'

      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner executes each line as an independent shell
      # command. A multi-line for-loop directly in its script property breaks
      # with "expecting done". Use one standalone POSIX script instead.
      - name: Prepare self-contained emulator test script
        shell: bash
        run: |
          mkdir -p android-release-smoke
          cat > android-release-smoke/run-release-test.sh <<'EOSH'
          #!/bin/sh
          set -eu
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          adb install -r android-release-smoke/boot-smoke-release.apk
          for pass in 1 2; do
            adb shell am force-stop com.totichat.beta || true
            adb logcat -c
            adb shell am start -W -n com.totichat.beta/com.totichat.totichat.MainActivity > "android-release-smoke/launch-${pass}.txt"
            if [ "$pass" = 1 ]; then sleep 30; else sleep 18; fi
            adb shell pidof com.totichat.beta > "android-release-smoke/pid-${pass}.txt" || true
            adb shell screencap -p /sdcard/totichat-release.png
            adb pull /sdcard/totichat-release.png "android-release-smoke/screenshot-${pass}.png"
            adb shell uiautomator dump /sdcard/totichat-release.xml || true
            adb pull /sdcard/totichat-release.xml "android-release-smoke/ui-${pass}.xml" || true
            adb logcat -d -v time > "android-release-smoke/logcat-${pass}.txt"
            if ! test -s "android-release-smoke/pid-${pass}.txt"; then
              echo "FAIL: release application process not running (pass ${pass})"
              exit 1
            fi
            test -s "android-release-smoke/screenshot-${pass}.png"
            if ! test -s "android-release-smoke/ui-${pass}.xml"; then
              echo "FAIL: no Android UI dump (pass ${pass})"
              exit 1
            fi
            if grep -q 'FATAL EXCEPTION: main' "android-release-smoke/logcat-${pass}.txt"; then
              echo "FAIL: fatal Android exception (pass ${pass})"
              exit 1
            fi
            if grep -q 'Failed to load dynamic library at path: libdartjni.so' "android-release-smoke/logcat-${pass}.txt"; then
              echo "FAIL: missing JNI runtime library (pass ${pass})"
              exit 1
            fi
            if grep -q 'could not start' "android-release-smoke/ui-${pass}.xml"; then
              echo "FAIL: Flutter bootstrap error screen (pass ${pass})"
              exit 1
            fi
            if ! grep -q 'TotiChat' "android-release-smoke/ui-${pass}.xml"; then
              echo "FAIL: Google login not visible to accessibility (pass ${pass})"
              exit 1
            fi
            echo "PASS: release/AOT green Google login visible, cold launch ${pass}"
          done
          EOSH
          sh -n android-release-smoke/run-release-test.sh

      - name: Cold-launch release app twice and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: sh android-release-smoke/run-release-test.sh

      - name: Retain release runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totichat-android14-release-startup-evidence
          path: |
            android-release-smoke/launch-*.txt
            android-release-smoke/pid-*.txt
            android-release-smoke/ui-*.xml
            android-release-smoke/screenshot-*.png
            android-release-smoke/logcat-*.txt
            android-release-smoke/release-apk-sha256.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stage test-only ARM64 green-shell APK after two emulator passes
        if: success()
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          test -f ../android-release-smoke/ui-1.xml
          test -f ../android-release-smoke/ui-2.xml
          grep -q 'TotiChat' ../android-release-smoke/ui-1.xml
          grep -q 'TotiChat' ../android-release-smoke/ui-2.xml
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          mkdir -p ../dist/green-staging
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/green-staging/TotiChat-Staging-Green-ARM64.apk
          unzip -t ../dist/green-staging/TotiChat-Staging-Green-ARM64.apk >/dev/null
          (cd ../dist/green-staging && sha256sum TotiChat-Staging-Green-ARM64.apk > SHA256SUMS.txt)

      - name: Upload green interface phone acceptance candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TotiChat-Staging-Green-ARM64
          path: dist/green-staging/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: No distribution or production changes
        run: echo 'Emulator-only release-mode diagnosis; no artifact APK published, no Play deployment and no backend writes.'
