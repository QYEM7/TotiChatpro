name: TotiChat Private Staging Android Debug APK

# This one-time push trigger builds only when this specific workflow file is
# created/changed. Ordinary feature commits do NOT distribute new APKs.
on:
  push:
    branches:
      - rebuild/flutter-v1
    paths:
      - '.github/workflows/totichat-staging-beta-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totichat-private-staging-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-private-staging-apk:
    if: github.ref == 'refs/heads/rebuild/flutter-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate standard Android Flutter scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.totichat --project-name totichat .

      - name: Restore Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Use Android compile SDK 37 required by permission_handler
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path('android/app/build.gradle.kts')
          source = build.read_text()
          old = 'compileSdk = flutter.compileSdkVersion'
          if source.count(old) != 1:
              raise SystemExit('Unexpected Flutter Android compile SDK template')
          build.write_text(source.replace(old, 'compileSdk = 37'))
          # compileSdk only; keep Flutter's minSdk and targetSdk unchanged.
          PY

      - name: Verify Staging-only Android settings before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path('flutter_app/lib/core/app_config.dart').read_text()
          manifest = Path('flutter_app/android/app/src/main/AndroidManifest.xml').read_text()
          assert "https://rziaedugbdwefbefcxjt.supabase.co" in config
          assert "isStaging && publishableKey.startsWith('sb_publishable_')" in config
          assert "com.totichat.next://auth/callback" in config
          assert 'android:scheme="com.totichat.next"' in manifest
          assert 'android:host="auth"' in manifest
          assert 'android:pathPrefix="/callback"' in manifest
          assert "android.permission.RECORD_AUDIO" in manifest
          assert "android.permission.INTERNET" in manifest
          assert not list(Path('flutter_app').rglob('*.apk'))
          PY

      - name: Analyze Flutter source and tests
        working-directory: flutter_app
        run: flutter analyze lib test --no-fatal-infos

      - name: Run Flutter unit and widget tests
        working-directory: flutter_app
        run: flutter test

      - name: Build APPROVED private debug APK against Staging only
        working-directory: flutter_app
        run: flutter build apk --debug --dart-define=SUPABASE_URL=https://rziaedugbdwefbefcxjt.supabase.co

      - name: Verify compiled APK and calculate SHA-256
        run: |
          test -s flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          sha256sum flutter_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload private internal test artifact (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: totichat-staging-android-debug-${{ github.sha }}
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
