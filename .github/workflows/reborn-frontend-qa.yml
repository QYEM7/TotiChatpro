name: TotiChat Reborn Frontend QA
on:
  push:
    branches: [develop/phase-2]
    paths:
      - 'app/index.html'
      - 'app/reborn/**'
      - 'app/phase2-auth.js'
      - 'app/phase2-livekit-sdk.mjs'
      - 'scripts/build-reborn-web.mjs'
      - 'tests/reborn-frontend.test.mjs'
      - 'tests/reborn-browser.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/reborn-frontend-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax and architecture contract
        run: |
          node --check app/reborn/core.js
          node --check app/reborn/features.js
          node --check app/phase2-auth.js
          node --test tests/reborn-frontend.test.mjs
      - name: Build fresh Android-ready app
        run: npm run build
      - name: Check actual WebView entry and assets
        run: |
          test -s dist/index.html
          test -s dist/app/reborn/core.js
          test -s dist/app/reborn/features.js
          test -s dist/app/reborn/styles.css
          test -s dist/app/phase2-livekit-sdk.bundle.js
          test -s dist/assets/images/toti_falcon_logo_1790422919580.jpg
          grep -Fq '<base href="./app/">' dist/index.html
          ! grep -Eq 'royal-final|frontend-finish|toti-nav-banner-refine' dist/index.html
      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 >/tmp/reborn-web.log 2>&1 &
          sleep 3
          node tests/reborn-browser.test.mjs
      - name: Upload Android-ready web payload
        uses: actions/upload-artifact@v4
        with:
          name: TotiChat-Reborn-Staging-Web
          path: dist/
          retention-days: 7
          if-no-files-found: error
