function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function syncComposer(){
 if(!composerOpen)return;
 const wrap=document.getElementById('composerWrap');if(!wrap)return;
 const vv=window.visualViewport;
 const inset=vv?Math.max(0,window.innerHeight-(vv.height+vv.offsetTop)):0;
 wrap.style.bottom=inset+'px';
}
function openComposer(){
 closeSheet();
 const wrap=document.getElementById('composerWrap');
 wrap.hidden=false;composerOpen=true;
 document.documentElement.classList.add('in-composer');
 syncComposer();
 const input=document.getElementById('composerInput');input.focus({preventScroll:true});
}
function closeComposer(){
 composerOpen=false;
 const wrap=document.getElementById('composerWrap');if(wrap){wrap.hidden=true;wrap.style.bottom='0px';}
 document.documentElement.classList.remove('in-composer');
 const input=document.getElementById('composerInput');if(input)input.blur();
}
function sendPreviewMessage(){
 const input=document.getElementById('composerInput');
 const message=input.value.trim();
 if(!message)return;
 previewMessages.push(message.slice(0,500)); if(previewMessages.length>30)previewMessages.shift();
 chatTab='الكل';closeComposer();render();
 const area=document.querySelector('.chatArea');if(area)area.scrollTop=area.scrollHeight;
 showToast('ظهرت الرسالة داخل المعاينة فقط، ولم تُرسل إلى السيرفر');
}
