name: totichat
description: TotiChat Flutter beta - staging only
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.2
  livekit_client: ^2.13.1
  # Android build on Flutter 3.47/AGP 9.1 uses compileSdk 36;
  # v13 pulls Android plugin 14.x and requires unavailable compileSdk 37.
  permission_handler: 12.0.3
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  uuid: ^4.5.1
  shared_preferences: 2.5.5
  # Android 2.5.0 uses Pigeon JNI that is broken by R8 in release mode.
  # Pin the endorsed platform implementation until its upstream fix lands.
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/ar.json
    - assets/images/
