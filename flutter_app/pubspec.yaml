name: totichat
description: TotiChat Flutter beta - staging only
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.2
  livekit_client: ^2.13.1
  permission_handler: ^13.0.2
